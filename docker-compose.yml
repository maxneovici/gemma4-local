services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5220:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LocalAi__BaseUrl: http://ollama:11434
      LocalAi__RequireLoopback: "false"
      LocalAi__ManageProcess: "false"
      LocalAi__BlockStartupUntilModelsReady: "false"
      LocalAi__Memory__QdrantBaseUrl: http://qdrant:6333
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started

  ollama:
    image: ollama/ollama:0.23.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  ollama_models:
